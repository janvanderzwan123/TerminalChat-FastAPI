name: Deploy FastAPI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, vps-runner]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        run: |
          # Move to deploy dir
          sudo mkdir -p /root/TerminalChat-FastAPI
          sudo chown -R runner:runner /root/TerminalChat-FastAPI
          cd /root/TerminalChat-FastAPI || exit 1

          # Pull latest repo
          sudo git reset --hard
          sudo git pull origin main

          # Setup venv
          if [ ! -d "venv" ]; then
              python3 -m venv venv
          fi
          source venv/bin/activate

          # Install dependencies
          pip install --upgrade pip
          pip install -r requirements.txt

          # Restart FastAPI
          sudo pkill -f "uvicorn app.main:app" || true
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          disown