name: Deploy TerminalChatFastAPI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.SERVER_HOST }} "
            DEPLOY_DIR=/root/TerminalChat-FastAPI

            # Go to existing repo
            cd \$DEPLOY_DIR || { echo 'Directory not found'; exit 1; }

            # Pull latest changes
            git reset --hard
            git pull origin main

            # Activate venv
            source venv/bin/activate

            # Install dependencies
            pip install --upgrade pip
            pip install -r requirements.txt

            # Restart FastAPI
            pkill -f 'uvicorn app.main:app' || true
            nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
            disown
          "
